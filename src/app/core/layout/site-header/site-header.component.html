<header class="site-header">
  <div class="container-shell">
    <div class="site-header__row">
      <a class="site-brand" routerLink="/">
        <div class="site-brand__mark">
          <img src="/logo.png" alt="Brand logo" />
        </div>

        <div class="site-brand__text">
          <span class="site-brand__title">{{ brandName }}</span>
          <span class="site-brand__subtitle">{{ brandSubtitle }}</span>
        </div>
      </a>

      <nav class="site-nav site-nav--desktop" aria-label="Main navigation">
        @for (item of navigation; track item.route) {
          <a
            class="site-nav__link"
            [routerLink]="item.route"
            routerLinkActive="site-nav__link--active"
            [routerLinkActiveOptions]="{ exact: item.route === '/' }"
          >
            {{ item.label }}
          </a>
        }
      </nav>

      <div class="site-header__actions">
        <a class="btn btn-primary site-header__cta" routerLink="/games">Explore</a>

        <button
          class="site-header__menu-btn"
          type="button"
          [attr.aria-expanded]="isMobileMenuOpen"
          aria-label="Toggle navigation menu"
          (click)="toggleMobileMenu()"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>

    @if (isMobileMenuOpen) {
      <nav class="site-nav site-nav--mobile" aria-label="Mobile navigation">
        @for (item of navigation; track item.route) {
          <a
            class="site-nav__link site-nav__link--mobile"
            [routerLink]="item.route"
            routerLinkActive="site-nav__link--active"
            [routerLinkActiveOptions]="{ exact: item.route === '/' }"
            (click)="closeMobileMenu()"
          >
            {{ item.label }}
          </a>
        }

        <a
          class="btn btn-primary site-header__cta site-header__cta--mobile"
          routerLink="/games"
          (click)="closeMobileMenu()"
        >
          Explore
        </a>
      </nav>
    }
  </div>
</header>
