<section class="apps-section section-spacing">
  <div class="container-shell">
    <app-section-title
      eyebrow="Apps"
      title="Practical mobile apps with cleaner, faster flows."
      description="EcoPulse, Aura Mood Tracker, and Habit Tracker should feel useful, polished, and easier to trust through stronger visual structure and better product framing."
    />

    <div class="apps-section__grid">
      @for (item of apps; track item.title) {
        <app-project-card
          [category]="item.category"
          [title]="item.title"
          [description]="item.description"
          [meta]="item.meta"
          [route]="'/apps/' + item.slug"
          [image]="item.image"
          [alt]="item.alt"
        />
      }
    </div>
  </div>
</section>
