<section class="studio-section section-spacing">
  <div class="container-shell">
    <div class="studio-section__grid">
      <app-section-title
        eyebrow="Studio"
        title="Games and apps built around clarity, speed, and accessibility."
        description="This version of the home translates the current Reimii message into a more premium structure, with stronger hierarchy and cleaner product presentation."
      />

      <div class="studio-section__cards">
        @for (item of features; track item.title) {
          <app-feature-card [title]="item.title" [description]="item.description" />
        }
      </div>
    </div>
  </div>
</section>
