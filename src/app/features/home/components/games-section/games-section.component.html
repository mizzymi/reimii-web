<section class="games-section section-spacing">
  <div class="container-shell">
    <app-section-title
      eyebrow="Games"
      title="Two game worlds with stronger presentation."
      description="Akaladrom and Epicore TCG should be shown like premium products, with cleaner visuals, stronger hierarchy, and more confident project storytelling."
    />

    <div class="games-section__grid games-section__grid--two">
      @for (item of games; track item.title) {
        <app-project-card
          [category]="item.category"
          [title]="item.title"
          [description]="item.description"
          [meta]="item.meta"
          [route]="'/games/' + item.slug"
          [image]="item.image"
          [alt]="item.alt"
        />
      }
    </div>
  </div>
</section>
