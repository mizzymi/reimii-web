<section class="hero-section">
  <div class="container-shell">
    <div class="hero-section__grid">
      <div class="hero-section__content">
        <span class="eyebrow">{{ hero.badge }}</span>

        <h1 class="hero-section__title">{{ hero.title }}</h1>

        <p class="hero-section__description">
          {{ hero.description }}
        </p>

        <div class="hero-section__actions">
          <app-primary-button
            [label]="hero.primaryAction.label"
            [route]="hero.primaryAction.route"
            variant="primary"
          />
          <app-primary-button
            [label]="hero.secondaryAction.label"
            [route]="hero.secondaryAction.route"
            variant="secondary"
          />
        </div>
      </div>

      <div class="hero-section__panel">
        <div class="hero-panel-card">
          <small class="hero-panel-card__label">Focus</small>
          <h3 class="hero-panel-card__title">Games, apps, and premium interfaces</h3>
        </div>

        <div class="hero-panel-grid">
          <div class="hero-panel-mini">
            <small class="hero-panel-card__label">Design</small>
            <p class="hero-panel-mini__text">Readable. Modern. Memorable.</p>
          </div>

          <div class="hero-panel-mini">
            <small class="hero-panel-card__label">Build</small>
            <p class="hero-panel-mini__text">Angular architecture that scales.</p>
          </div>
        </div>

        <div class="hero-panel-card hero-panel-card--dark">
          <small class="hero-panel-card__label">Direction</small>
          <p class="hero-panel-mini__text">A sharper digital presence for Reimii.</p>
        </div>
      </div>
    </div>
  </div>
</section>
