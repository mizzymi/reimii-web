<section class="cta-section section-spacing">
  <div class="container-shell">
    <div class="cta-section__panel">
      <span class="eyebrow">{{ cta.eyebrow }}</span>
      <h2 class="cta-section__title">{{ cta.title }}</h2>
      <p class="cta-section__description">{{ cta.description }}</p>

      <div class="cta-section__actions">
        <app-primary-button
          [label]="cta.primaryAction.label"
          [route]="cta.primaryAction.route"
          variant="primary"
        />
        <app-primary-button
          [label]="cta.secondaryAction.label"
          [route]="cta.secondaryAction.route"
          variant="secondary"
        />
      </div>
    </div>
  </div>
</section>
