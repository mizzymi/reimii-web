@if (game(); as item) {
  <section class="project-detail section-spacing">
    <div class="container-shell">
      <a class="project-detail__back" routerLink="/games">← Back to games</a>

      <div class="project-detail__hero">
        <div class="project-detail__content">
          <span class="project-detail__category">{{ item.category }}</span>
          <h1 class="project-detail__title">{{ item.title }}</h1>
          <p class="project-detail__description">{{ item.description }}</p>
          <p class="project-detail__meta">{{ item.meta }}</p>
        </div>

        <div class="project-detail__media">
          <img [src]="item.image" [alt]="item.alt" />
        </div>
      </div>
    </div>
  </section>
} @else {
  <section class="project-detail section-spacing">
    <div class="container-shell">
      <h1>Game not found</h1>
      <a routerLink="/games">Go back to games</a>
    </div>
  </section>
}
